name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.13 is the floor required by pdfjs-dist (see "engines" in
          # package.json). On Node 20 `Promise.withResolvers` is missing, so the
          # AcroForm field reader throws and fillable official templates are
          # silently misclassified as non-fillable.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Tests
        run: pnpm run --if-present test

      - name: Production build
        run: pnpm run build
