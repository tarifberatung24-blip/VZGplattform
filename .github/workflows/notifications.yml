name: notifications

# Daily HORIZON notifications run: writes due reports and deadline reminders for
# every user and e-mails the fresh ones (when SMTP is configured in Render).
# Needs two repository secrets: HORIZON_BASE_URL (for example
# https://vzgplattform.onrender.com) and NOTIFICATIONS_CRON_SECRET (the same
# value as the Render environment variable). Without them the job does nothing.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 09:00 in Sofia (summer time), 08:00 in winter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/notifications/run
        env:
          BASE_URL: ${{ secrets.HORIZON_BASE_URL }}
          CRON_SECRET: ${{ secrets.NOTIFICATIONS_CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::HORIZON_BASE_URL or NOTIFICATIONS_CRON_SECRET not set; skipping."
            exit 0
          fi
          # Render's free plan sleeps; the first request can take about a minute.
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 180 -X POST "${BASE_URL%/}/api/notifications/run" \
            -H "x-horizon-cron-secret: ${CRON_SECRET}"
          echo
